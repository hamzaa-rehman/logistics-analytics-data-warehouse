<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Fact-to-Fact Fanout Prevention</title><desc>Why directly joining trips, fuel purchases and maintenance records by truck_key inflates measures, and how vw_truck_cost_efficiency avoids it.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B04545"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3C7A52"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1DC"/><rect width="3" height="6" fill="#D9A441"/></pattern></defs><rect width="1400" height="1000" fill="#FFFFFF"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1B2A41" text-anchor="start">Fact-to-Fact Fanout Prevention</text><text x="40" y="80" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Example: vw_truck_cost_efficiency · gold.fact_trips, gold.fact_fuel_purchases, gold.fact_maintenance_records</text><rect x="40" y="100" width="1320" height="420" rx="10" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.5" /><rect x="64" y="120" width="26" height="26" rx="13" fill="#B04545" /><text x="77" y="139" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✕</text><text x="102" y="139" font-size="17" font-weight="700" fill="#B04545" text-anchor="start">INCORRECT: direct fact-to-fact join on truck_key</text><text x="1336" y="139" font-size="13" font-weight="400" fill="#64748B" text-anchor="end" font-style="italic">Illustrative example: hypothetical rows for one truck, not project data</text><rect x="64" y="170" width="270" height="34" rx="6" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.4" /><text x="199.0" y="192" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_trips</text><rect x="64" y="204" width="270" height="30" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="76" y="224" font-size="13" font-weight="400" fill="#475569" text-anchor="start">T1 · truck_key = X</text><rect x="64" y="234" width="270" height="30" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="76" y="254" font-size="13" font-weight="400" fill="#475569" text-anchor="start">T2 · truck_key = X</text><text x="68" y="286" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start">2 trip records</text><path d="M304 272 L304 360" fill="none" stroke="#B04545" stroke-width="1.6" stroke-linejoin="round"/><rect x="354" y="170" width="270" height="34" rx="6" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.4" /><text x="489.0" y="192" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_fuel_purchases</text><rect x="354" y="204" width="270" height="30" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="366" y="224" font-size="13" font-weight="400" fill="#475569" text-anchor="start">F1 · truck_key = X</text><rect x="354" y="234" width="270" height="30" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="366" y="254" font-size="13" font-weight="400" fill="#475569" text-anchor="start">F2 · truck_key = X</text><rect x="354" y="264" width="270" height="30" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="366" y="284" font-size="13" font-weight="400" fill="#475569" text-anchor="start">F3 · truck_key = X</text><text x="358" y="316" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start">3 fuel purchase records</text><path d="M594 302 L594 360" fill="none" stroke="#B04545" stroke-width="1.6" stroke-linejoin="round"/><rect x="644" y="170" width="270" height="34" rx="6" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.4" /><text x="779.0" y="192" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_maintenance_records</text><rect x="644" y="204" width="270" height="30" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="656" y="224" font-size="13" font-weight="400" fill="#475569" text-anchor="start">M1 · truck_key = X</text><rect x="644" y="234" width="270" height="30" rx="0" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><text x="656" y="254" font-size="13" font-weight="400" fill="#475569" text-anchor="start">M2 · truck_key = X</text><text x="648" y="286" font-size="12.5" font-weight="600" fill="#475569" text-anchor="start">2 maintenance records</text><path d="M884 272 L884 360" fill="none" stroke="#B04545" stroke-width="1.6" stroke-linejoin="round"/><path d="M304 360 L960 360" fill="none" stroke="#B04545" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahr)"/><rect x="960" y="320" width="150" height="80" rx="8" fill="#FFFFFF" stroke="#B04545" stroke-width="1.6" /><text x="1035" y="352" font-size="13" font-weight="700" fill="#B04545" text-anchor="middle">JOIN ON</text><text x="1035" y="372" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">truck_key</text><path d="M1110 360 L1150 360" fill="none" stroke="#B04545" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahr)"/><rect x="1150" y="170" width="190" height="330" rx="8" fill="#FFFFFF" stroke="#B04545" stroke-width="1.6" /><text x="1245" y="200" font-size="13" font-weight="700" fill="#64748B" text-anchor="middle">Joined result</text><text x="1245" y="240" font-size="28" font-weight="700" fill="#B04545" text-anchor="middle">12 rows</text><text x="1245" y="262" font-size="14" font-weight="600" fill="#475569" text-anchor="middle">2 × 3 × 2</text><rect x="1175" y="285" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1191" y="304" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r1</text><rect x="1215" y="285" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1231" y="304" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r2</text><rect x="1255" y="285" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1271" y="304" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r3</text><rect x="1295" y="285" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1311" y="304" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r4</text><rect x="1175" y="323" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1191" y="342" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r5</text><rect x="1215" y="323" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1231" y="342" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r6</text><rect x="1255" y="323" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1271" y="342" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r7</text><rect x="1295" y="323" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1311" y="342" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r8</text><rect x="1175" y="361" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1191" y="380" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r9</text><rect x="1215" y="361" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1231" y="380" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r10</text><rect x="1255" y="361" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1271" y="380" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r11</text><rect x="1295" y="361" width="32" height="30" rx="4" fill="#FDF3F3" stroke="#DDA9A9" stroke-width="1.1" /><text x="1311" y="380" font-size="11" font-weight="600" fill="#B04545" text-anchor="middle">r12</text><text x="1245" y="418" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">for ONE truck</text><text x="1245" y="440" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">every trip, fuel and</text><text x="1245" y="456" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">maintenance row is</text><text x="1245" y="472" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">paired with all others</text><text x="64" y="440" font-size="13" font-weight="700" fill="#B04545" text-anchor="start">Impact on measures</text><text x="64" y="464" font-size="14" font-weight="400" fill="#1B2A41" text-anchor="start">Each trip row is repeated 6×, each fuel purchase row 4×, each maintenance row 6×.</text><text x="64" y="488" font-size="14" font-weight="400" fill="#1B2A41" text-anchor="start">SUM() of trip, fuel and maintenance measures is multiplied, so truck-level totals are inflated.</text><rect x="40" y="545" width="1320" height="420" rx="10" fill="#F1F7F3" stroke="#A5C9B1" stroke-width="1.5" /><rect x="64" y="565" width="26" height="26" rx="13" fill="#3C7A52" /><text x="77" y="584" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">✓</text><text x="102" y="584" font-size="17" font-weight="700" fill="#3C7A52" text-anchor="start">IMPLEMENTED: aggregate each fact independently, then join to gold.dim_truck</text><text x="1336" y="584" font-size="13" font-weight="400" fill="#64748B" text-anchor="end" font-style="italic">Same illustrative truck for comparison</text><rect x="64" y="630" width="290" height="60" rx="6" fill="#FFFFFF" stroke="#3B6FB6" stroke-width="1.4" stroke-dasharray="5 3" /><text x="209" y="654" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_trips</text><text x="209" y="674" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">AGGREGATE BY truck_key · own date filter</text><path d="M354 660 L410 660" fill="none" stroke="#3C7A52" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahg)"/><rect x="410" y="634" width="230" height="52" rx="6" fill="#FFFFFF" stroke="#3C7A52" stroke-width="1.4" /><text x="525" y="665" font-size="13.5" font-weight="600" fill="#1B2A41" text-anchor="middle">2 trip records → 1 row</text><path d="M640 660 L690 660" fill="none" stroke="#3C7A52" stroke-width="1.6" stroke-linejoin="round"/><rect x="64" y="710" width="290" height="60" rx="6" fill="#FFFFFF" stroke="#3B6FB6" stroke-width="1.4" stroke-dasharray="5 3" /><text x="209" y="734" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_fuel_purchases</text><text x="209" y="754" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">AGGREGATE BY truck_key · own date filter</text><path d="M354 740 L410 740" fill="none" stroke="#3C7A52" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahg)"/><rect x="410" y="714" width="230" height="52" rx="6" fill="#FFFFFF" stroke="#3C7A52" stroke-width="1.4" /><text x="525" y="745" font-size="13.5" font-weight="600" fill="#1B2A41" text-anchor="middle">3 fuel purchases → 1 row</text><path d="M640 740 L690 740" fill="none" stroke="#3C7A52" stroke-width="1.6" stroke-linejoin="round"/><rect x="64" y="790" width="290" height="60" rx="6" fill="#FFFFFF" stroke="#3B6FB6" stroke-width="1.4" stroke-dasharray="5 3" /><text x="209" y="814" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_maintenance_records</text><text x="209" y="834" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">AGGREGATE BY truck_key · own date filter</text><path d="M354 820 L410 820" fill="none" stroke="#3C7A52" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahg)"/><rect x="410" y="794" width="230" height="52" rx="6" fill="#FFFFFF" stroke="#3C7A52" stroke-width="1.4" /><text x="525" y="825" font-size="13.5" font-weight="600" fill="#1B2A41" text-anchor="middle">2 maintenance records → 1 row</text><path d="M640 820 L690 820" fill="none" stroke="#3C7A52" stroke-width="1.6" stroke-linejoin="round"/><path d="M690 660 L690 820" fill="none" stroke="#3C7A52" stroke-width="1.6" stroke-linejoin="round"/><path d="M690 740 L770 740" fill="none" stroke="#3C7A52" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahg)"/><text x="730" y="731" font-size="11.5" font-weight="700" fill="#3C7A52" text-anchor="middle">LEFT JOIN</text><rect x="770" y="712" width="200" height="56" rx="6" fill="#EEF1F5" stroke="#8795A8" stroke-width="1.3" /><text x="870.0" y="737.0" font-size="14" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.dim_truck</text><text x="870.0" y="753.0" font-size="11.5" font-weight="400" fill="#64748B" text-anchor="middle">join base</text><path d="M970 740 L1030 740" fill="none" stroke="#3C7A52" stroke-width="1.8" stroke-linejoin="round" marker-end="url(#ahg)"/><rect x="1030" y="670" width="310" height="140" rx="8" fill="#FFFFFF" stroke="#3C7A52" stroke-width="1.8" /><text x="1185" y="702" font-size="15" font-weight="700" fill="#1B2A41" text-anchor="middle">vw_truck_cost_efficiency</text><text x="1185" y="730" font-size="14" font-weight="600" fill="#3C7A52" text-anchor="middle">1 row per truck (truck_id)</text><text x="1185" y="754" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">One row per truck_key from each</text><text x="1185" y="771" font-size="12" font-weight="400" fill="#64748B" text-anchor="middle">aggregate, so no fact-to-fact fanout</text><text x="1185" y="795" font-size="12.5" font-weight="600" fill="#475569" text-anchor="middle">1 × 1 × 1 → 1 row</text><text x="64" y="885" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Unassigned fact records are excluded from truck-level attribution and reconciled separately.</text><text x="64" y="908" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Reporting period: calendar years 2022–2024 inclusive. Combined recorded spend per mile is a descriptive proxy. No currency is assumed.</text><text x="64" y="931" font-size="13" font-weight="400" fill="#64748B" text-anchor="start" font-style="italic">Illustrative counts only (2 trip, 3 fuel, 2 maintenance records); not actual project data.</text></svg>