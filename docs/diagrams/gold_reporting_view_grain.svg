<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="840" viewBox="0 0 1100 840" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Reporting View Grain</title><desc>Exact grain of each of the eight Gold reporting views and why grain matters.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B04545"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3C7A52"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1DC"/><rect width="3" height="6" fill="#D9A441"/></pattern></defs><rect width="1100" height="840" fill="#FFFFFF"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1B2A41" text-anchor="start">Reporting View Grain</text><text x="40" y="80" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Gold layer · what one row represents in each reporting view</text><text x="70" y="118" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">VIEW</text><text x="350" y="118" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">GRAIN</text><text x="640" y="118" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">GRAIN KEY</text><text x="800" y="118" font-size="11.5" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1.2">SOURCE FACT</text><rect x="40" y="132" width="1020" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="132" width="8" height="48" rx="3" fill="#3B6FB6" /><text x="70" y="162" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_revenue_performance</text><text x="350" y="162" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per load</text><rect x="640" y="142" width="65.7109375" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="672.85546875" y="161" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">load_id</text><rect x="800" y="143" width="112.61328125" height="26" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="856.306640625" y="160.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_loads</text><rect x="40" y="186" width="1020" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="186" width="8" height="48" rx="3" fill="#3B6FB6" /><text x="70" y="216" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_delivery_performance</text><text x="350" y="209" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per event</text><text x="350" y="226" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Pickup and Delivery events</text><rect x="640" y="196" width="73.78515625" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="676.892578125" y="215" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">event_id</text><rect x="800" y="197" width="174.66796875" height="26" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="887.333984375" y="214.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_delivery_events</text><rect x="40" y="240" width="1020" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="240" width="8" height="48" rx="3" fill="#3B6FB6" /><text x="70" y="270" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_fleet_performance</text><text x="350" y="270" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per trip</text><rect x="640" y="250" width="59.9765625" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="669.98828125" y="269" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">trip_id</text><rect x="800" y="251" width="106.90234375" height="26" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="853.451171875" y="268.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_trips</text><rect x="40" y="294" width="1020" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="294" width="8" height="48" rx="3" fill="#3E7C7C" /><text x="70" y="324" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_customer_performance</text><text x="350" y="317" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per customer</text><text x="350" y="334" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Loads aggregated by customer_key</text><rect x="640" y="304" width="98.64453125" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="689.322265625" y="323" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">customer_id</text><rect x="800" y="305" width="112.61328125" height="26" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="856.306640625" y="322.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_loads</text><rect x="40" y="348" width="1020" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="348" width="8" height="48" rx="3" fill="#3B6FB6" /><text x="70" y="378" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_fuel_cost_analysis</text><text x="350" y="378" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per fuel purchase</text><rect x="640" y="358" width="129.0859375" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="704.54296875" y="377" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">fuel_purchase_id</text><rect x="800" y="359" width="173.34765625" height="26" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="886.673828125" y="376.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_fuel_purchases</text><rect x="40" y="402" width="1020" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="402" width="8" height="48" rx="3" fill="#3B6FB6" /><text x="70" y="432" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_maintenance_performance</text><text x="350" y="432" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per maintenance record</text><rect x="640" y="412" width="120.6484375" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="700.32421875" y="431" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">maintenance_id</text><rect x="800" y="413" width="211.9453125" height="26" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="905.97265625" y="430.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_maintenance_records</text><rect x="40" y="456" width="1020" height="48" rx="6" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="456" width="8" height="48" rx="3" fill="#3B6FB6" /><text x="70" y="486" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_safety_performance</text><text x="350" y="486" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per safety incident</text><rect x="640" y="466" width="89.6953125" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="684.84765625" y="485" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">incident_id</text><rect x="800" y="467" width="179.32421875" height="26" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="889.662109375" y="484.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_safety_incidents</text><rect x="40" y="510" width="1020" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1" /><rect x="40" y="510" width="8" height="48" rx="3" fill="#3E7C7C" /><text x="70" y="540" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_truck_cost_efficiency</text><text x="350" y="533" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per truck</text><text x="350" y="550" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">Each fact aggregated by truck_key</text><rect x="640" y="520" width="71.44921875" height="28" rx="5" fill="#FFFFFF" stroke="#8795A8" stroke-width="1.2" /><text x="675.724609375" y="539" font-size="13" font-weight="700" fill="#1B2A41" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace">truck_id</text><text x="800" y="540" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="start">3 facts: trips, fuel, maintenance</text><rect x="40" y="573" width="18" height="12" rx="2" fill="#3B6FB6" /><text x="64" y="584" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Business-record grain: one row per source record</text><rect x="460" y="573" width="18" height="12" rx="2" fill="#3E7C7C" /><text x="484" y="584" font-size="12.5" font-weight="400" fill="#475569" text-anchor="start">Entity grain: facts aggregated by entity key before joining</text><text x="40" y="632" font-size="18" font-weight="700" fill="#1B2A41" text-anchor="start">Why grain matters</text><rect x="40.0" y="648" width="328.0" height="128" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="40.0" y="648" width="328.0" height="5" rx="2" fill="#1E3A5F" /><text x="56.0" y="682" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">Aggregate at the right level</text><text x="56.0" y="706" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Aggregation must respect the underlying grain.</text><text x="56.0" y="725" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Summing or counting at another level misstates</text><text x="56.0" y="744" font-size="13" font-weight="400" fill="#475569" text-anchor="start">the result.</text><rect x="386.0" y="648" width="328.0" height="128" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="386.0" y="648" width="328.0" height="5" rx="2" fill="#1E3A5F" /><text x="402.0" y="682" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">Control join cardinality</text><text x="402.0" y="706" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Different fact tables should not be combined</text><text x="402.0" y="725" font-size="13" font-weight="400" fill="#475569" text-anchor="start">directly without controlling join cardinality.</text><rect x="732.0" y="648" width="328.0" height="128" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="732.0" y="648" width="328.0" height="5" rx="2" fill="#1E3A5F" /><text x="748.0" y="682" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">Grain defines safe analysis</text><text x="748.0" y="706" font-size="13" font-weight="400" fill="#475569" text-anchor="start">The reporting view grain determines how its</text><text x="748.0" y="725" font-size="13" font-weight="400" fill="#475569" text-anchor="start">measures can be safely analysed.</text></svg>