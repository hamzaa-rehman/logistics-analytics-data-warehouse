<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="1526" viewBox="0 0 1100 1526" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Eight Reporting Views Overview</title><desc>Business purpose, source fact tables, grain and analytical focus of each Gold reporting view.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B04545"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3C7A52"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1DC"/><rect width="3" height="6" fill="#D9A441"/></pattern></defs><rect width="1100" height="1526" fill="#FFFFFF"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1B2A41" text-anchor="start">Eight Reporting Views Overview</text><text x="40" y="80" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Gold layer · purpose, source fact, grain and analytical focus of each reporting view</text><rect x="40" y="108" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="40" y="108" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="40" y="138" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="56" y="136.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_revenue_performance</text><text x="522" y="136" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">1</text><text x="56" y="182" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Load-level revenue reporting</text><text x="56" y="214" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="134" y="196" width="112.61328125" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="190.306640625" y="212.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_loads</text><text x="56" y="248" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="134" y="249" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per load (load_id)</text><text x="56" y="280" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="134" y="281" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Reported load revenue, fuel surcharge, accessorial charges,</text><text x="134" y="299" font-size="13" font-weight="400" fill="#475569" text-anchor="start">monthly trends, route performance, booking types, load types.</text><rect x="562" y="108" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="562" y="108" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="562" y="138" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="578" y="136.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_delivery_performance</text><text x="1044" y="136" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">2</text><text x="578" y="182" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Pickup and delivery event timing</text><text x="578" y="214" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="656" y="196" width="174.66796875" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="743.333984375" y="212.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_delivery_events</text><text x="578" y="248" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="656" y="249" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per event (event_id)</text><text x="578" y="280" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="656" y="281" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Delivery-only on-time performance, detention, event timing,</text><text x="656" y="299" font-size="13" font-weight="400" fill="#475569" text-anchor="start">facility analysis.</text><rect x="578" y="314" width="466" height="46" rx="5" fill="#FBF1DC" /><text x="586" y="330" font-size="10.5" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="1">NOTE</text><text x="628" y="330" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">Contains Pickup and Delivery events; only Delivery events feed</text><text x="628" y="347" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">the on-time KPI.</text><rect x="40" y="450" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="40" y="450" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="40" y="480" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="56" y="478.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_fleet_performance</text><text x="522" y="478" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">3</text><text x="56" y="524" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Trip-level fleet operations</text><text x="56" y="556" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="134" y="538" width="106.90234375" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="187.451171875" y="554.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_trips</text><text x="56" y="590" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="134" y="591" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per trip (trip_id)</text><text x="56" y="622" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="134" y="623" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Trip volume, distance, fuel consumed, weighted MPG, average</text><text x="134" y="641" font-size="13" font-weight="400" fill="#475569" text-anchor="start">trip MPG, idle time, assignment coverage.</text><rect x="56" y="656" width="466" height="29" rx="5" fill="#FBF1DC" /><text x="64" y="672" font-size="10.5" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="1">NOTE</text><text x="106" y="672" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">No route relationship in this view.</text><rect x="562" y="450" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="562" y="450" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="562" y="480" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="578" y="478.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_customer_performance</text><text x="1044" y="478" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">4</text><text x="578" y="524" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Customer activity and revenue contribution</text><text x="578" y="556" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="656" y="538" width="112.61328125" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="712.306640625" y="554.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_loads</text><text x="578" y="590" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="656" y="591" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per customer (customer_id)</text><text x="578" y="622" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="656" y="623" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Customer activity, reported load revenue, average revenue per</text><text x="656" y="641" font-size="13" font-weight="400" fill="#475569" text-anchor="start">load, revenue contribution, customer type, ranking.</text><rect x="578" y="656" width="466" height="46" rx="5" fill="#FBF1DC" /><text x="586" y="672" font-size="10.5" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="1">NOTE</text><text x="628" y="672" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">Loads aggregated by customer_key. First observed load date is</text><text x="628" y="689" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">not a verified acquisition date.</text><rect x="40" y="792" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="40" y="792" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="40" y="822" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="56" y="820.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_fuel_cost_analysis</text><text x="522" y="820" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">5</text><text x="56" y="866" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Fuel purchase cost reporting</text><text x="56" y="898" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="134" y="880" width="173.34765625" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="220.673828125" y="896.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_fuel_purchases</text><text x="56" y="932" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="134" y="933" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per fuel purchase (fuel_purchase_id)</text><text x="56" y="964" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="134" y="965" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Purchase count, gallons purchased, recorded fuel cost,</text><text x="134" y="983" font-size="13" font-weight="400" fill="#475569" text-anchor="start">weighted cost per gallon, monthly trends, entity analysis,</text><text x="134" y="1001" font-size="13" font-weight="400" fill="#475569" text-anchor="start">assignment coverage.</text><rect x="56" y="1016" width="466" height="46" rx="5" fill="#FBF1DC" /><text x="64" y="1032" font-size="10.5" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="1">NOTE</text><text x="106" y="1032" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">Fuel purchased and fuel consumed on trips are separate</text><text x="106" y="1049" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">measures.</text><rect x="562" y="792" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="562" y="792" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="562" y="822" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="578" y="820.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_maintenance_performance</text><text x="1044" y="820" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">6</text><text x="578" y="866" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Maintenance cost and downtime reporting</text><text x="578" y="898" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="656" y="880" width="211.9453125" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="761.97265625" y="896.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_maintenance_records</text><text x="578" y="932" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="656" y="933" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per maintenance record (maintenance_id)</text><text x="578" y="964" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="656" y="965" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Maintenance records, recorded cost, labor, parts, downtime,</text><text x="656" y="983" font-size="13" font-weight="400" fill="#475569" text-anchor="start">maintenance types, trucks, source-reported facility locations.</text><rect x="578" y="998" width="466" height="29" rx="5" fill="#FBF1DC" /><text x="586" y="1014" font-size="10.5" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="1">NOTE</text><text x="628" y="1014" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">facility_location is source text, not a gold.dim_facility relationship.</text><rect x="40" y="1134" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="40" y="1134" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="40" y="1164" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="56" y="1162.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_safety_performance</text><text x="522" y="1162" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">7</text><text x="56" y="1208" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Safety incident reporting</text><text x="56" y="1240" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="134" y="1222" width="179.32421875" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="223.662109375" y="1238.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_safety_incidents</text><text x="56" y="1274" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="134" y="1275" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per safety incident (incident_id)</text><text x="56" y="1306" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="134" y="1307" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Incident frequency, at-fault classifications, injuries,</text><text x="134" y="1325" font-size="13" font-weight="400" fill="#475569" text-anchor="start">preventability, recorded damage, claims, annual trends,</text><text x="134" y="1343" font-size="13" font-weight="400" fill="#475569" text-anchor="start">descriptive truck/driver analysis.</text><rect x="56" y="1358" width="466" height="46" rx="5" fill="#FBF1DC" /><text x="64" y="1374" font-size="10.5" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="1">NOTE</text><text x="106" y="1374" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">Incident location is source-reported text, not a facility</text><text x="106" y="1391" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">relationship.</text><rect x="562" y="1134" width="498" height="318" rx="8" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.3" /><rect x="562" y="1134" width="498" height="44" rx="8" fill="#1E3A5F" /><rect x="562" y="1164" width="498" height="14" rx="0" fill="#1E3A5F" /><text x="578" y="1162.5" font-size="17" font-weight="700" fill="#FFFFFF" text-anchor="start">vw_truck_cost_efficiency</text><text x="1044" y="1162" font-size="13" font-weight="700" fill="#9FB3CC" text-anchor="end">8</text><text x="578" y="1208" font-size="14.5" font-weight="600" fill="#1B2A41" text-anchor="start">Truck-level recorded spend and efficiency</text><text x="578" y="1240" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">SOURCE</text><rect x="656" y="1222" width="106.90234375" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="709.451171875" y="1238.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_trips</text><rect x="768.90234375" y="1222" width="173.34765625" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="855.576171875" y="1238.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_fuel_purchases</text><rect x="656" y="1252" width="211.9453125" height="24" rx="5" fill="#DCE8F7" stroke="#3B6FB6" stroke-width="1.2" /><text x="761.97265625" y="1268.5" font-size="12.5" font-weight="700" fill="#1B2A41" text-anchor="middle">gold.fact_maintenance_records</text><text x="656" y="1284" font-size="12" font-weight="400" fill="#64748B" text-anchor="start">each independently aggregated by truck_key</text><text x="578" y="1320" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">GRAIN</text><text x="656" y="1321" font-size="13.5" font-weight="700" fill="#1B2A41" text-anchor="start">One row per truck (truck_id)</text><text x="578" y="1352" font-size="11" font-weight="700" fill="#64748B" text-anchor="start" letter-spacing="1">FOCUS</text><text x="656" y="1353" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Trip activity, actual distance, trip fuel and weighted MPG, fuel</text><text x="656" y="1371" font-size="13" font-weight="400" fill="#475569" text-anchor="start">purchases, maintenance cost and downtime, combined</text><text x="656" y="1389" font-size="13" font-weight="400" fill="#475569" text-anchor="start">recorded spend.</text><rect x="578" y="1404" width="466" height="46" rx="5" fill="#FBF1DC" /><text x="586" y="1420" font-size="10.5" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="1">NOTE</text><text x="628" y="1420" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">Each fact aggregated by truck_key first. Spend per mile is a</text><text x="628" y="1437" font-size="12.5" font-weight="400" fill="#8A5A00" text-anchor="start">descriptive proxy, not operating cost per mile.</text><text x="40" y="1502" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Colour key: blue chips = gold fact tables · amber panels = interpretation notes</text></svg>