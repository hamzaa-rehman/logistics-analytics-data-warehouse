<svg xmlns="http://www.w3.org/2000/svg" width="1220" height="880" viewBox="0 0 1220 880" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif"><title>Reporting Data Coverage Timeline</title><desc>Verified activity reporting periods per reporting view; January 2025 is partial for delivery and fuel data.</desc><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#475569"/></marker><marker id="ahr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#B04545"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" markerUnits="userSpaceOnUse" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#3C7A52"/></marker><pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><rect width="6" height="6" fill="#FBF1DC"/><rect width="3" height="6" fill="#D9A441"/></pattern></defs><rect width="1220" height="880" fill="#FFFFFF"/><text x="40" y="52" font-size="30" font-weight="700" fill="#1B2A41" text-anchor="start">Reporting Data Coverage Timeline</text><text x="40" y="80" font-size="15" font-weight="400" fill="#64748B" text-anchor="start">Verified activity reporting periods · January 2025 is partial-period data and is not a complete reporting month</text><path d="M340 142 L340 658" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-linejoin="round"/><text x="340" y="134" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Jan 2022</text><path d="M604 142 L604 658" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-linejoin="round"/><text x="604" y="134" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Jan 2023</text><path d="M868 142 L868 658" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-linejoin="round"/><text x="868" y="134" font-size="12.5" font-weight="700" fill="#475569" text-anchor="middle">Jan 2024</text><path d="M1132 142 L1132 658" fill="none" stroke="#E2E8F0" stroke-width="1.2" stroke-linejoin="round"/><text x="1132" y="134" font-size="12.5" font-weight="700" fill="#8A5A00" text-anchor="middle">Jan 2025</text><rect x="32" y="146" width="1156" height="64" rx="4" fill="#F8FAFC" /><text x="44" y="174" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_revenue_performance</text><text x="44" y="192" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Jan 2022 – Dec 2024</text><rect x="340" y="158" width="792" height="26" rx="4" fill="#1E3A5F" /><text x="736.0" y="176" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jan 2022 – Dec 2024 · complete</text><text x="44" y="238" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_delivery_performance</text><text x="44" y="256" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Jan 2022 – Jan 2025</text><rect x="340" y="222" width="792" height="26" rx="4" fill="#1E3A5F" /><text x="736.0" y="240" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jan 2022 – Dec 2024 · complete</text><rect x="1132" y="222" width="22" height="26" rx="0" fill="url(#hatch)" stroke="#8A5A00" stroke-width="1.3" /><text x="1154" y="268" font-size="12.5" font-weight="600" fill="#8A5A00" text-anchor="end">Jan 2025 partial: 86 Delivery events</text><rect x="32" y="274" width="1156" height="64" rx="4" fill="#F8FAFC" /><text x="44" y="302" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_fleet_performance</text><text x="44" y="320" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Jan 2022 – Dec 2024</text><rect x="340" y="286" width="792" height="26" rx="4" fill="#1E3A5F" /><text x="736.0" y="304" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jan 2022 – Dec 2024 · complete</text><text x="44" y="366" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_customer_performance</text><text x="44" y="384" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Jan 2022 – Dec 2024</text><rect x="340" y="350" width="792" height="26" rx="4" fill="#1E3A5F" /><text x="736.0" y="368" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jan 2022 – Dec 2024 · complete</text><text x="340" y="396" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Load activity coverage. Contract start dates can reach back to 2020.</text><rect x="32" y="402" width="1156" height="64" rx="4" fill="#F8FAFC" /><text x="44" y="430" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_fuel_cost_analysis</text><text x="44" y="448" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Jan 2022 – Jan 2025</text><rect x="340" y="414" width="792" height="26" rx="4" fill="#1E3A5F" /><text x="736.0" y="432" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jan 2022 – Dec 2024 · complete</text><rect x="1132" y="414" width="22" height="26" rx="0" fill="url(#hatch)" stroke="#8A5A00" stroke-width="1.3" /><text x="1154" y="460" font-size="12.5" font-weight="600" fill="#8A5A00" text-anchor="end">Jan 2025 partial: 201 purchases</text><text x="44" y="494" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_maintenance_performance</text><text x="44" y="512" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Jan 2022 – Dec 2024</text><rect x="340" y="478" width="792" height="26" rx="4" fill="#1E3A5F" /><text x="736.0" y="496" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jan 2022 – Dec 2024 · complete</text><rect x="32" y="530" width="1156" height="64" rx="4" fill="#F8FAFC" /><text x="44" y="558" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_safety_performance</text><text x="44" y="576" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Jan 2022 – Dec 2024</text><rect x="340" y="542" width="792" height="26" rx="4" fill="#1E3A5F" /><text x="736.0" y="560" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Jan 2022 – Dec 2024 · complete</text><text x="44" y="622" font-size="14.5" font-weight="700" fill="#1B2A41" text-anchor="start">vw_truck_cost_efficiency</text><text x="44" y="640" font-size="12.5" font-weight="400" fill="#64748B" text-anchor="start">Calendar years 2022–2024</text><rect x="340" y="606" width="792" height="26" rx="4" fill="#52667F" /><text x="736.0" y="624" font-size="13" font-weight="600" fill="#FFFFFF" text-anchor="middle">Calendar years 2022–2024 (inclusive)</text><rect x="44" y="670" width="26" height="16" rx="3" fill="#1E3A5F" /><text x="78" y="683" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Complete reporting period</text><rect x="300" y="670" width="26" height="16" rx="0" fill="url(#hatch)" stroke="#8A5A00" stroke-width="1.3" /><text x="334" y="683" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Partial period (January 2025)</text><rect x="580" y="670" width="26" height="16" rx="3" fill="#52667F" /><text x="614" y="683" font-size="13" font-weight="400" fill="#475569" text-anchor="start">Calendar-year filter</text><rect x="32" y="712" width="1156" height="128" rx="8" fill="#FBF1DC" /><text x="52" y="738" font-size="13" font-weight="700" fill="#8A5A00" text-anchor="start" letter-spacing="0.5">Reading notes</text><text x="52" y="766" font-size="13.5" font-weight="400" fill="#8A5A00" text-anchor="start">•  January 2025 is a partial period for delivery and fuel purchase data. It is not a complete reporting month.</text><text x="52" y="792" font-size="13.5" font-weight="400" fill="#8A5A00" text-anchor="start">•  Customer contract start dates can extend back to 2020, but customer load activity begins in January 2022.</text><text x="52" y="818" font-size="13.5" font-weight="400" fill="#8A5A00" text-anchor="start">•  Coverage differs by view. vw_truck_cost_efficiency applies its own calendar-year filter (2022–2024 inclusive).</text></svg>